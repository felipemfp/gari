name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev jq
      - run: npm ci
      - run: npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons
      - run: npx bats test
      - run: node --test ui/model.test.ts
      - run: npm run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons
      # vhdx.ps1 under Windows PowerShell 5.1 (what the app calls): it must parse,
      # and a scan on a box without WSL must still end in exactly one done event.
      - shell: powershell
        run: |
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\vhdx.ps1", [ref]$null, [ref]$e)
          if ($e) { $e | ForEach-Object { $_.ToString() }; exit 1 }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\vhdx.ps1 -Mode scan -Distro NoSuchDistro
          $out
          $done = @($out | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.event -eq 'done' })
          if ($done.Count -ne 1) { throw "expected one done event, got $($done.Count)" }
          $log = Join-Path $env:RUNNER_TEMP 'c.log'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\vhdx.ps1 -Mode compact -Distro NoSuchDistro -Log $log -List "$env:RUNNER_TEMP\missing.txt"
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern 'nothing was shut down' -Quiet)) { throw 'compact without a list must not shut anything down' }
          # A sparse disk (auto-shrink on) cannot be compacted: skip it, shut nothing down.
          $vhd = Join-Path $env:RUNNER_TEMP 'sparse.vhdx'
          Set-Content -LiteralPath $vhd -Value 'x'
          fsutil sparse setflag $vhd | Out-Null
          Set-Content -LiteralPath "$env:RUNNER_TEMP\list.txt" -Value $vhd
          $log2 = Join-Path $env:RUNNER_TEMP 's.log'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\vhdx.ps1 -Mode compact -Distro NoSuchDistro -Log $log2 -List "$env:RUNNER_TEMP\list.txt"
          Get-Content $log2
          if (-not (Select-String -Path $log2 -Pattern 'is sparse' -Quiet)) { throw 'sparse disk was not skipped' }
          if (-not (Select-String -Path $log2 -Pattern 'nothing was shut down' -Quiet)) { throw 'only sparse disks listed must not shut anything down' }
      # Rust unit tests on the real target (wincache, history, event parsing).
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: gari-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
